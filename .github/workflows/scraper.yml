name: Auto Scraper & Database Sync

on:
  schedule:
    # Berjalan setiap 12 jam sekali (pukul 07.00 dan 19.00 WIB / 00.00 dan 12.00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    # Memungkinkan pemicuan manual dari tab Actions di GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Diperlukan untuk menulis/push history ke repositori
    
    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependensi
        run: |
          pip install requests beautifulsoup4

      - name: Jalankan Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python py/scraper_kabarlomba.py

      - name: Simpan & Push scraped_history.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add py/scraped_history.json
          
          # Hanya lakukan commit dan push jika ada perubahan pada berkas scraped_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: Update scraped history [skip ci]"
            git push
          else
            echo "Tidak ada riwayat baru untuk disimpan."
          fi
